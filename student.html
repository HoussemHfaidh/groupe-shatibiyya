<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوابة الطالب - بوابة الطالب</title>
    <link rel="stylesheet" href="styles-dev.css?v=20261001-tables" />
  <link rel="stylesheet" href="khatma.css?v=20260927-prod" />
    <link rel="stylesheet" href="review.css?v=20261001-tables" />
      <link rel="stylesheet" href="student-dashboard.css?v=20260929-prod">
  </head>
  <body class="student-page">
    <main class="student-shell">
      <section id="loginPanel" class="panel student-card">
        <p class="eyebrow">الشاطبية - بوابة الطالب</p>
        <h1>تسجيل الدخول</h1>
        <p class="subtitle">
          ادخل بالبريد الإلكتروني المسجل عند الأستاذ.
        </p>

        <form id="loginForm" class="student-form">
          <label class="field">
            <span>البريد الإلكتروني</span>
            <input id="loginEmail" type="email" autocomplete="username" required />
          </label>

          <label class="remember-session">
            <input id="keepSessionOpen" type="checkbox" checked />
            <span>إبقاء الجلسة مفتوحة</span>
          </label>

          <div class="login-actions">
            <button class="primary" type="submit">دخول</button>
          </div>
        </form>

        <div id="loginResult" class="result-box" aria-live="polite">
          الرجاء تسجيل الدخول.
        </div>
      </section>

      <section id="studentPanel" class="panel student-card" hidden>
        <p class="eyebrow">الشاطبية - حرز الأماني</p>
        <h1>تأكيد التسميع</h1>
        <p class="subtitle">
          اختر الأسبوع، ثم انظر إلى الطلاب الذين تم اعتمادهم، وبعد التسميع يؤكد الطالب الذي سمعت عنده.
        </p>

        <div class="account-box">
          <strong id="accountName"></strong>
          <button id="logoutBtn" class="ghost" type="button">خروج</button>
        </div>

        <form id="submissionForm" class="student-form">
          <label class="field">
            <span>الأسبوع</span>
            <select id="studentWeekSelect" required></select>
          </label>

          <fieldset id="validatorChoice" class="validator-choice">
            <legend>الطلاب المتاحون</legend>
            <p id="validatorHint" class="validator-hint"></p>
            <div id="validatorList" class="validator-list"></div>
          </fieldset>

          <label class="field">
            <span>أنا الطالب / الطالبة</span>
            <select id="validatorSelect" required></select>
          </label>

          <label class="field">
            <span>أؤكد تسميع الطالب / الطالبة</span>
            <select id="studentSelect" required></select>
          </label>

          <label class="field">
            <span>ملاحظة اختيارية</span>
            <textarea id="studentNote" rows="3" placeholder="مثال: تم تأكيد التسميع"></textarea>
          </label>

          <button class="primary" type="submit">تأكيد التسميع</button>
        </form>

        <div id="studentResult" class="result-box" aria-live="polite">
          جار تحميل البوابة...
        </div>
      </section>
    </main>

    <script src="config-production.js?v=20260912-prod-1"></script>
    <script src="weekly-clock.js?v=20260912-prod-1"></script>
    <script src="recitation-maintenance.js?v=20260912-prod-1"></script>
    <script src="roster-model.js?v=20260927-roster"></script>
    <script src="roster.js?v=20260927-roster"></script>
    <script src="jam-model.js?v=20261001-jam-membership"></script>
    <script src="review-model.js?v=20260927-roster"></script>
    <script src="review.js?v=20261001-review-start"></script>
    <script src="jam.js?v=20261001-tables"></script>
    <script src="khatma-model.js?v=20260927-prod"></script>
    <script src="khatma.js?v=20260929-label"></script>
    <script src="live-data.js?v=20260929-prod"></script>
    <script src="activity-live.js?v=20260929-prod"></script>
    <script src="student-dashboard-model.js?v=20260929-prod"></script>
    <script src="student-dashboard.js?v=20260929-prod"></script>
    <script src="student-production.js?v=20260929-prod"></script>
  </body>
</html>

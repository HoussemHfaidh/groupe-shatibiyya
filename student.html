<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوابة الطالب</title>
    <link rel="stylesheet" href="styles.css?v=20260902-arabic-only" />
  </head>
  <body class="student-page">
    <main class="student-shell">
      <section class="panel student-card">
        <p class="eyebrow">الشاطبية - حرز الأماني</p>
        <h1>تأكيد التسميع</h1>
        <p class="subtitle">
          اختر الأسبوع، ثم انظر إلى الطلاب الذين تم اعتمادهم، وبعد التسميع يؤكد الطالب الذي سمعت عنده.
        </p>

        <form id="submissionForm" class="student-form">
          <label class="field">
            <span>الأسبوع</span>
            <select id="studentWeekSelect" required></select>
          </label>

          <fieldset id="validatorChoice" class="validator-choice">
            <legend>الطلاب المتاحون</legend>
            <p id="validatorHint" class="validator-hint"></p>
            <div id="validatorList" class="validator-list"></div>
          </fieldset>

          <label class="field">
            <span>أنا الطالب المعتمد الذي يؤكد</span>
            <select id="validatorSelect" required></select>
          </label>

          <label class="field">
            <span>الطالب الذي سمّع عندي</span>
            <select id="studentSelect" required></select>
          </label>

          <label class="field">
            <span>ملاحظة اختيارية</span>
            <textarea id="studentNote" rows="3" placeholder="مثال: تم تأكيد التسميع"></textarea>
          </label>

          <button class="primary" type="submit">تأكيد التسميع</button>
        </form>

        <div id="studentResult" class="result-box" aria-live="polite">
          جار تحميل البوابة...
        </div>
      </section>
    </main>

    <script src="config.js?v=20260606-firebase-default"></script>
    <script src="student.js?v=20260902-arabic-only"></script>
  </body>
</html>

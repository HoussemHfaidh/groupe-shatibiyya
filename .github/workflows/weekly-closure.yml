name: Weekly recitation closure
on:
  schedule:
    # UTC alternatives for 06:00 Paris in summer/winter. The module checks the deadline.
    - cron: '0 4,5 * * 0,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-recitation-closure
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/close-prod.cjs
